<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakes & Cakes BakeHouse | Cake in a can</title>
<meta name="description" content="Fresh cake in a can from Bakes & Cakes BakeHouse, baked without preservatives. Pick your flavour and order by call or WhatsApp.">
<meta name="theme-color" content="#14080b">
<meta property="og:title" content="Bakes & Cakes BakeHouse">
<meta property="og:description" content="Fresh cake in a can, baked without preservatives. Pick your flavour and order today.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2314080b'/%3E%3Crect x='4' y='4' width='56' height='56' fill='none' stroke='%23c9a45c' stroke-width='2'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' font-style='italic' text-anchor='middle' fill='%23c9a45c'%3EB%26C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
<style>
:root{
  --display:'Cormorant Garamond','Garamond','Palatino Linotype',Georgia,serif;
  --body:'Jost','Avenir Next','Segoe UI',system-ui,sans-serif;
  --gold:#c9a45c; --gold2:#ecd9a8; --ivory:#f6ecd9; --night:#14080b;
  --fg:var(--ivory);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--night);overscroll-behavior:none}
body{font-family:var(--body);color:var(--fg);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr:focus{width:auto;height:auto;clip:auto;z-index:20;left:8px;top:8px;background:#fff;color:#000;padding:.5rem .8rem}

#stage{position:fixed;inset:0;overflow:hidden;color:var(--fg)}
#stage:after{content:"";position:absolute;inset:10px;border:1px solid rgba(201,164,92,.55);pointer-events:none;z-index:5}

/* background */
.bg{position:absolute;inset:0;overflow:hidden;animation:bgin .8s ease both}
@keyframes bgin{from{opacity:0}to{opacity:1}}
.bg:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(236,217,168,.16),transparent 58%)}
.bg.has-photo:before{display:none}

/* top */
.bars{position:absolute;z-index:4;left:26px;right:26px;top:calc(24px + env(safe-area-inset-top));display:flex;gap:5px}
.bars i{flex:1;height:2px;background:rgba(246,236,217,.2);overflow:hidden}
.bars b{display:block;height:100%;width:0;background:var(--gold)}
.bars .done b{width:100%}
.bars .on b{animation:fill var(--dur,6s) linear forwards}
.bars .on.last b{animation:none;width:100%}
@keyframes fill{to{width:100%}}
.top{position:absolute;z-index:4;left:26px;right:20px;top:calc(36px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
.logo{font:italic 600 1.15rem/1 var(--display);letter-spacing:.04em;color:var(--gold2)}
.pp{width:38px;height:38px;border-radius:50%;border:1px solid rgba(201,164,92,.6);background:rgba(20,8,11,.4);display:grid;place-items:center;cursor:pointer}
.pp svg{width:14px;height:14px;fill:var(--gold2)}

/* content */
.zone{position:absolute;inset:0;z-index:1;touch-action:manipulation}
.slide{position:absolute;z-index:2;left:0;right:0;top:calc(92px + env(safe-area-inset-top));bottom:calc(92px + env(safe-area-inset-bottom));padding:0 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(.5rem,1.7vh,1rem);pointer-events:none}
.slide a,.slide button{pointer-events:auto}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) calc(var(--i,0)*.12s + .1s) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.kicker{font:italic 500 1.1rem/1 var(--display);color:var(--gold);letter-spacing:.06em}
.rule{width:64px;height:1px;background:var(--gold);position:relative;margin:.1rem 0}
.rule:after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;background:var(--night);border:1px solid var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
.h1{font:500 clamp(2.7rem,13vw,4.2rem)/.95 var(--display);letter-spacing:-.01em;margin:0;color:var(--ivory)}
.h1 em{font-style:italic;color:var(--gold2)}
.h2{font:500 clamp(2rem,9.5vw,3rem)/1 var(--display);margin:0;color:var(--ivory)}
.mood{font:italic 500 1.3rem/1.3 var(--display);max-width:20rem;margin:0;color:var(--gold2)}
.sub{font-size:.95rem;line-height:1.6;font-weight:400;max-width:20rem;margin:0;color:rgba(246,236,217,.82)}
.hint{font-size:.82rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:.8rem}
.hint:before,.hint:after{content:"";width:24px;height:1px;background:var(--gold)}

/* cans */
.can{width:min(46vw,28dvh,210px);animation:drop 1.1s cubic-bezier(.2,.8,.2,1) .15s both}
.can svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 22px rgba(0,0,0,.55))}
.can img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border:1px solid var(--gold)}
@keyframes drop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.trio{display:flex;justify-content:center;align-items:flex-end;height:min(26dvh,210px)}
.trio .can{width:min(30vw,22dvh,132px);animation:drop 1.1s cubic-bezier(.2,.8,.2,1) calc(var(--i)*.15s + .1s) both}
.trio .can:nth-child(2){margin:0 -2%;margin-bottom:10px;z-index:1;transform:scale(1.08)}

/* photo slides */
.cover{position:absolute;left:0;right:0;top:0;height:72%;overflow:hidden;animation:kenburns 14s ease-out both}
.cover img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;display:block}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,8,11,.55),rgba(20,8,11,0) 24%,rgba(20,8,11,0) 52%,var(--end) 100%)}
@keyframes kenburns{from{transform:scale(1.07)}to{transform:scale(1)}}
.slide.photo{justify-content:flex-end;padding-bottom:6px}
.layers{width:auto;max-width:100%;max-height:min(46dvh,440px);display:block;border:1px solid var(--gold);padding:5px;background:rgba(20,8,11,.5)}
.keys{display:flex;flex-wrap:wrap;gap:.5rem 1.1rem;justify-content:center}
.keys span{display:inline-flex;align-items:center;gap:.5rem;font-size:.88rem;color:var(--ivory)}
.keys i{width:11px;height:11px;transform:rotate(45deg);border:1px solid var(--gold)}
.allergy{font-size:.85rem;font-style:italic}

/* panels */
.wcard{width:100%;max-width:21rem;border:1px solid rgba(201,164,92,.6);padding:1rem 1.2rem 1.1rem;background:rgba(20,8,11,.45)}
.wcard .dt{font-size:.8rem;color:rgba(246,236,217,.65)}
.wcard .lb{font:italic 500 1rem/1 var(--display);color:var(--gold);margin:.35rem 0 .1rem}
.wcard .w{font:500 2.5rem/1.1 var(--display);color:var(--gold2)}
.wcard p{margin:.3rem 0 0;font-size:.9rem;line-height:1.5;color:rgba(246,236,217,.85)}
.facts{width:100%;max-width:22rem;border-top:1px solid rgba(201,164,92,.5)}
.fact{display:flex;align-items:center;gap:1rem;text-align:left;padding:.9rem .2rem;border-bottom:1px solid rgba(201,164,92,.5)}
.fact svg,.tile svg,.big svg,.cta svg,.dock svg{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fact svg{width:28px;height:28px;color:var(--gold)}
.fact strong{display:block;font:600 1.3rem/1.1 var(--display);color:var(--ivory)}
.fact span{font-size:.88rem;color:rgba(246,236,217,.78)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;width:100%;max-width:23rem}
.tile{border:1px solid rgba(201,164,92,.55);padding:.8rem .75rem;text-align:left;background:rgba(20,8,11,.4)}
.tile svg{width:24px;height:24px;color:var(--gold)}
.tile strong{display:block;font:600 1.15rem/1.1 var(--display);margin:.4rem 0 .15rem;color:var(--ivory)}
.tile span{font-size:.8rem;line-height:1.35;display:block;color:rgba(246,236,217,.78)}

/* buttons */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:52px;padding:0 1.8rem;border:1px solid var(--gold);background:linear-gradient(135deg,#e8d09a,#b98f43);color:#26120a;font-weight:600;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
.cta svg{width:18px;height:18px}
.bigs{width:100%;max-width:22rem;border-top:1px solid rgba(201,164,92,.5)}
.big{display:flex;align-items:center;gap:1rem;text-align:left;text-decoration:none;padding:.85rem .2rem;border-bottom:1px solid rgba(201,164,92,.5);min-height:64px}
.big svg{width:26px;height:26px;color:var(--gold)}
.big strong{display:block;font:600 1.3rem/1.1 var(--display);color:var(--ivory)}
.big span.t{font-size:.88rem;word-break:break-word;color:rgba(246,236,217,.8)}
.again{border:0;background:none;padding:.5rem 1rem;font:italic 500 1.05rem var(--display);color:var(--gold2);cursor:pointer;text-decoration:underline;text-underline-offset:4px}

.dock{position:absolute;z-index:4;left:26px;right:26px;bottom:calc(26px + env(safe-area-inset-bottom));display:flex;gap:8px;transition:transform .5s,opacity .5s}
.dock.off{transform:translateY(130%);opacity:0;pointer-events:none}
.dock a{height:52px;display:flex;align-items:center;justify-content:center;gap:.55rem;text-decoration:none;border:1px solid var(--gold);background:rgba(20,8,11,.7);color:var(--gold2)}
.dock svg{width:20px;height:20px}
.dock .round{width:52px;flex:none}
.dock .wa{flex:1;background:linear-gradient(135deg,#e8d09a,#b98f43);color:#26120a;font-weight:600;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase}

@media (max-height:700px){.allergy{display:none}.layers{max-height:38dvh}.sub{font-size:.88rem}.wcard .w{font-size:2rem}.tile{padding:.55rem .65rem}.tile span{font-size:.74rem}.fact{padding:.6rem .2rem}.can{width:min(38vw,24dvh)}}
@media (min-width:700px){#stage{max-width:480px;left:50%;right:auto;width:480px;margin-left:-240px;box-shadow:0 0 90px rgba(0,0,0,.7)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rise,.can{opacity:1;transform:none}}
</style>
</head>
<body>
<noscript><p style="padding:2rem;color:#fff">Please turn on JavaScript to browse our flavours. To order, call or WhatsApp 081 289 1918.</p></noscript>
<div id="stage" aria-live="off">
  <div class="bars" id="bars" aria-hidden="true"></div>
  <div class="top">
    <div class="logo" id="logo"></div>
    <button class="pp" id="pp" aria-label="Pause"></button>
  </div>
  <div class="zone" id="zone"></div>
  <button class="sr" id="prevBtn">Previous slide</button>
  <button class="sr" id="nextBtn">Next slide</button>
  <main id="slide" class="slide"></main>
  <nav class="dock" id="dock" aria-label="Order and contact"></nav>
</div>

<script>
/* ============ EDIT THIS SECTION ============ */
const SITE = {
  name: "Bakes & Cakes BakeHouse",
  tagline: "Crumbs of Joy",

  // Contact details
  phone: "081 289 1918",       // used for calls
  whatsapp: "081 289 1918",    // used for WhatsApp orders
  email: "order@bakescakes.co.za",
  website: "www.bakescakes.co.za",
  countryCode: "27",           // South Africa. A leading 0 is replaced with this.

  // Care guidance. Check these against your own recipes before publishing.
  care: { fridge: "2–5 °C", days: 3, openedHours: 24, restMinutes: 15 },

  // Seconds each screen stays before moving on by itself
  seconds: 7
};

// One entry per flavour. The QR code for each flavour links to  ?f=<slug>
//  match:  finishes the sentence "Pick this when ..."
//  image:  optional product photo. Leave "" to use the drawn cake.
//  layersImage / layers: optional "inside the can" photo and the names of its layers
//  colors: the drawn cake (cake, cream, accent).  theme: screen colours (two background colours + text colour)
const FLAVOURS = [
  { slug: "vanilla", name: "Vanilla", description: "A soft vanilla cake, light and simple.",
    match: "you want something classic and comforting", image: "",
    colors: { cake: "#e6c88a", cream: "#fffaf0", accent: "#c9a45c" },
    theme: { a: "#2b1e12", b: "#120a06", fg: "#f6ecd9" }, ingredients: [], allergens: [] },
  { slug: "chocolate", name: "Chocolate", description: "Rich chocolate cake for the sweet tooth.",
    match: "you want something rich and indulgent", image: "",
    colors: { cake: "#4a2418", cream: "#f3d9c4", accent: "#c9a45c" },
    theme: { a: "#3a1d14", b: "#140805", fg: "#f6ecd9" }, ingredients: [], allergens: [] },
  { slug: "red-velvet", name: "Red velvet", description: "Classic red velvet with a tender crumb.",
    match: "it feels like a celebration",
    image: "images/rv.jpeg",
    layersImage: "images/rve.jpeg",
    layers: [{ name: "Swiss meringue buttercream", color: "#fff6e6" }, { name: "Red velvet cake", color: "#b5001f" }],
    colors: { cake: "#9d0f1f", cream: "#fff6f0", accent: "#c9a45c" },
    theme: { a: "#5a0a16", b: "#1a0508", fg: "#f6ecd9" }, ingredients: [], allergens: [] }
];

// Word of the day. It changes every day and starts again after the last one.
const WORDS = [
  { w: "Savour", m: "Slow down for one bite. The best part of a sweet moment is noticing it." },
  { w: "Joy", m: "Joy is rarely loud. Today it might be a spoon, a cold can and ten quiet minutes." },
  { w: "Gather", m: "Good cake is better shared. Call someone and make a small occasion of today." },
  { w: "Warmth", m: "Be the warmth in someone's day. A kind word costs nothing and lingers like vanilla." },
  { w: "Treat", m: "You do not need a reason. Today, you are the reason." },
  { w: "Gratitude", m: "Name three small good things from today before you take the first bite." },
  { w: "Indulge", m: "A little indulgence is not a luxury, it is a reset. Enjoy it without apology." },
  { w: "Patience", m: "Good things rise slowly. Trust the process, in the oven and in life." },
  { w: "Delight", m: "Look for one small delight today. It is usually closer than you think." },
  { w: "Kindness", m: "Leave something sweeter than you found it: a message, a smile, a slice." },
  { w: "Comfort", m: "Some days need soft things: a warm blanket, a good song, a cold sweet bite." },
  { w: "Celebrate", m: "Not every win is big. Celebrate the ones nobody saw you earn." },
  { w: "Generous", m: "Share the bigger spoon. Generosity tastes better than sugar." },
  { w: "Cherish", m: "Cherish the ordinary moments. They are the ones you will miss." },
  { w: "Bloom", m: "Grow at your own pace. Even the finest cake needs time to rise." },
  { w: "Glow", m: "Do something today that makes you glow, even if it is small." },
  { w: "Gentle", m: "Be gentle with yourself. You are doing better than you think." },
  { w: "Golden", m: "Make today a golden one: good company, good food and a good mood." },
  { w: "Wonder", m: "Stay curious. Try a new flavour and let it surprise you." },
  { w: "Together", m: "Sweetness multiplies when it is shared. Reach out to someone you love." },
  { w: "Fresh", m: "A fresh start can begin at any hour. Today is as good as any." },
  { w: "Sparkle", m: "Add a little sparkle where you can. Tiny touches change a whole day." },
  { w: "Grace", m: "Give grace to others and to yourself. Everyone is mid-recipe." },
  { w: "Cosy", m: "Find your cosy corner today and stay a little longer than planned." },
  { w: "Tradition", m: "Make a small tradition of something sweet. Rituals turn days into memories." },
  { w: "Heart", m: "Bake with heart, speak with heart, live with heart. It always shows." },
  { w: "Honour", m: "Honour the people who feed you, in kitchens, at tables and in life." },
  { w: "Treasure", m: "Treasure the people at your table. They are the best ingredient." },
  { w: "Radiant", m: "Walk in as if the room was waiting for you. It was." },
  { w: "Courage", m: "Try the thing that makes you nervous. Something sweet waits on the other side." },
  { w: "Home", m: "Home is a feeling: warm, familiar, a little sweet. Carry it with you." }
];
/* ============ END OF EDIT SECTION ============ */

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- contact helpers ---------- */
const intl = (n) => { const d = String(n).replace(/\D/g,''); return d.startsWith('0') ? SITE.countryCode + d.slice(1) : d; };
const telLink = () => 'tel:+' + intl(SITE.phone);
const waLink = (flavour) => 'https://wa.me/' + intl(SITE.whatsapp) + '?text=' + encodeURIComponent(
  flavour ? `Hi! I'd like to order a ${flavour.name} cake in a can.` : `Hi! I'd like to order a cake in a can.`);
const mailLink = (flavour) => 'mailto:' + SITE.email + '?subject=' + encodeURIComponent(flavour ? `Order: ${flavour.name} cake in a can` : 'Cake in a can enquiry');
const webLink = () => 'https://' + SITE.website.replace(/^https?:\/\//,'');

/* ---------- word of the day ---------- */
function todaysWord(){
  const d = new Date();
  const n = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  return { ...WORDS[n % WORDS.length], date: d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }) };
}
const greeting = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; };

/* ---------- artwork ---------- */
let artId = 0;
function cakeArt(f){
  const c = f.colors, id = 'can' + (artId++);
  return `<svg viewBox="0 0 120 140" role="img" aria-label="A can of ${esc(f.name)} cake">
    <defs><clipPath id="${id}"><rect x="28" y="50" width="64" height="78" rx="6"/></clipPath>
    <linearGradient id="${id}g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient></defs>
    <path d="M34 48 Q32 32 48 31 Q46 18 60 20 Q68 10 77 21 Q92 22 88 38 Q95 48 86 48 Z" fill="${c.cream}"/>
    <circle cx="62" cy="14" r="5" fill="${c.accent}"/>
    <g clip-path="url(#${id})">
      <rect x="28" y="50" width="64" height="78" fill="${c.cake}"/>
      <rect x="28" y="76" width="64" height="7" fill="${c.cream}"/>
      <rect x="28" y="102" width="64" height="7" fill="${c.cream}"/>
      <rect x="28" y="50" width="64" height="78" fill="url(#${id}g)"/>
    </g>
    <rect x="28" y="50" width="64" height="78" rx="6" fill="none" stroke="${c.accent}" stroke-width="1.6"/>
    <rect x="24" y="44" width="72" height="8" rx="2" fill="${c.accent}"/>
    <rect x="24" y="126" width="72" height="5" rx="2" fill="${c.accent}"/>
  </svg>`;
}
const picture = (f) => f.image ? `<img src="${esc(f.image)}" alt="${esc(f.name)} cake in a can">` : cakeArt(f);

const ICON = {
  cold: '<path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  jar: '<path d="M5 8h14v12H5zM8 8V5h8v3"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M5 19l2-2"/>',
  fork: '<path d="M7 3v6a2.5 2.5 0 0 0 5 0V3M9.5 11v10M17 21V3c-2.5 1.5-3 5-3 8h3"/>',
  up: '<path d="M12 20V5M6 11l6-6 6 6M6 22h12"/>',
  leaf: '<path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15zM5 19l8-8"/>',
  can: '<path d="M6 5h12v15a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2zM6 9h12"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  chat: '<path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'
};
const svg = (n) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- slides ---------- */
function buildSlides(startSlug){
  const c = SITE.care;
  const landed = startSlug && FLAVOURS.find(x => x.slug === startSlug.toLowerCase());
  const list = landed ? [landed, ...FLAVOURS.filter(x => x !== landed)] : FLAVOURS.slice();
  const secs = SITE.seconds * 1000;
  const slides = [];

  slides.push({ key: 'welcome', dur: secs + 1500, theme: { a: '#3a0d18', b: '#14080b', fg: '#f6ecd9' },
    html: () => {
      const t = todaysWord();
      const cans = FLAVOURS.slice(0,3).map((f,i) => `<div class="can" style="--i:${i}">${cakeArt(f)}</div>`).join('');
      return `<span class="kicker rise" style="--i:0">${greeting()}, and welcome</span>
        <div class="trio">${cans}</div>
        <h1 class="h1 rise" style="--i:3">Fresh cake<br><em>in a can</em></h1>
        <div class="rule rise" style="--i:4"></div>
        <aside class="wcard rise" style="--i:5" aria-label="Word of the day">
          <div class="dt">${esc(t.date)}</div><div class="lb">Word of the day</div>
          <div class="w">${esc(t.w)}</div><p>${esc(t.m)}</p></aside>
        <div class="hint rise" style="--i:6">Tap to begin</div>`;
    }});

  list.forEach((f, i) => {
    const label = landed && i === 0 ? "Here's your flavour" : 'Match your flavour';
    if (f.image){
      slides.push({ key: 'f-' + f.slug, flavour: f, dur: secs, theme: f.theme, cover: f.image, photoAlt: `${f.name} cake in a can`,
        html: () => `<span class="kicker rise" style="--i:0">${label}</span>
          <h2 class="h1 rise" style="--i:1">${esc(f.name)}</h2>
          <div class="rule rise" style="--i:2"></div>
          <p class="mood rise" style="--i:3">Pick this when ${esc(f.match)}.</p>
          <p class="sub rise" style="--i:4">${esc(f.description)}</p>`
      });
    } else {
      slides.push({ key: 'f-' + f.slug, flavour: f, dur: secs, theme: f.theme,
        html: () => `<span class="kicker rise" style="--i:0">${label}</span>
          <div class="can">${picture(f)}</div>
          <h2 class="h1 rise" style="--i:3">${esc(f.name)}</h2>
          <div class="rule rise" style="--i:3"></div>
          <p class="mood rise" style="--i:4">Pick this when ${esc(f.match)}.</p>
          <p class="sub rise" style="--i:5">${esc(f.description)}</p>
          <a class="cta rise" style="--i:6" href="${waLink(f)}" rel="noopener">${svg('chat')}Order ${esc(f.name)}</a>`
      });
    }
    if (f.layersImage){
      slides.push({ key: 'l-' + f.slug, flavour: f, dur: secs + 1500, theme: f.theme,
        html: () => `<span class="kicker rise" style="--i:0">Inside the can</span>
          <h2 class="h2 rise" style="--i:1">Layer by layer</h2>
          <img class="layers rise" style="--i:2" src="${esc(f.layersImage)}" alt="${esc(f.name)} cake pulled apart to show its layers">
          <div class="keys rise" style="--i:4">${(f.layers || []).map(l => `<span><i style="background:${esc(l.color)}"></i>${esc(l.name)}</span>`).join('')}</div>
          <p class="sub allergy rise" style="--i:5">Allergies? Please ask us before you eat.</p>`
      });
    }
  });

  slides.push({ key: 'fresh', dur: secs, theme: { a: '#1d2a22', b: '#0b110d', fg: '#f6ecd9' },
    html: () => `<span class="kicker rise" style="--i:0">Why you will love it</span>
      <h2 class="h2 rise" style="--i:1">Baked fresh.<br>Nothing added to last.</h2>
      <div class="facts">
        <div class="fact rise" style="--i:3">${svg('leaf')}<div><strong>No preservatives</strong><span>Just cake, the way it should taste.</span></div></div>
        <div class="fact rise" style="--i:4">${svg('can')}<div><strong>Sealed in a can</strong><span>Easy to carry, share and gift.</span></div></div>
        <div class="fact rise" style="--i:5">${svg('clock')}<div><strong>Best within ${c.days} days</strong><span>Keep it chilled and enjoy it fresh.</span></div></div>
      </div>`
  });

  slides.push({ key: 'care', dur: secs + 2000, theme: { a: '#2a1a3a', b: '#0f0814', fg: '#f6ecd9' },
    html: () => {
      const items = [
        ['cold', 'Fridge', `Keep at ${c.fridge}`], ['clock', `${c.days} days`, 'From the baked date'],
        ['jar', 'Once opened', `Reseal, finish in ${c.openedHours} hrs`], ['sun', 'No heat', 'Not in hot cars or sun'],
        ['fork', 'Before you eat', `Rest ${c.restMinutes} min at room temp`], ['up', 'Upright', 'Carry it level']
      ];
      return `<span class="kicker rise" style="--i:0">Keep it perfect</span>
        <h2 class="h2 rise" style="--i:1">Look after it</h2>
        <div class="tiles">${items.map(([i,t,d],k) => `<div class="tile rise" style="--i:${k+2}">${svg(i)}<strong>${esc(t)}</strong><span>${esc(d)}</span></div>`).join('')}</div>`;
    }});

  slides.push({ key: 'order', dur: null, last: true, theme: { a: '#3a0d18', b: '#14080b', fg: '#f6ecd9' },
    html: () => `<span class="kicker rise" style="--i:0">Orders and questions</span>
      <h2 class="h2 rise" style="--i:1">Let's get you a cake</h2>
      <div class="bigs">
        <a class="big rise" style="--i:2" href="${telLink()}">${svg('phone')}<span><strong>Call us</strong><span class="t">${esc(SITE.phone)}</span></span></a>
        <a class="big rise" style="--i:3" href="${waLink(null)}" rel="noopener">${svg('chat')}<span><strong>WhatsApp</strong><span class="t">${esc(SITE.whatsapp)}</span></span></a>
        <a class="big rise" style="--i:4" href="${mailLink(null)}">${svg('mail')}<span><strong>Email</strong><span class="t">${esc(SITE.email)}</span></span></a>
        <a class="big rise" style="--i:5" href="${webLink()}" rel="noopener" target="_blank">${svg('globe')}<span><strong>Website</strong><span class="t">${esc(SITE.website)}</span></span></a>
      </div>
      <button class="again rise" style="--i:6" id="again">Start again</button>`
  });
  return slides;
}

/* ---------- player ---------- */
const slides = buildSlides(new URLSearchParams(location.search).get('f'));
let idx = 0, userPaused = calm, holding = false, bgEl = null;
const stage = $('#stage'), barsEl = $('#bars'), slideEl = $('#slide'), dock = $('#dock'), pp = $('#pp');

$('#logo').textContent = SITE.name;

function paintBg(theme, cover, alt){
  const old = bgEl;
  bgEl = document.createElement('div');
  bgEl.className = 'bg';
  bgEl.style.background = `linear-gradient(170deg, ${theme.a} 0%, ${theme.b} 100%)`;
  if (cover){
    bgEl.classList.add('has-photo');
    bgEl.style.setProperty('--end', theme.b);
    bgEl.insertAdjacentHTML('beforeend', `<div class="cover"><img src="${esc(cover)}" alt="${esc(alt || '')}"></div>`);
  }
  stage.insertBefore(bgEl, stage.firstChild);
  if (old) setTimeout(() => old.remove(), 800);
  stage.style.setProperty('--fg', theme.fg);
}

function renderBars(){
  const s = slides[idx];
  barsEl.innerHTML = slides.map((x,i) => `<i class="${i < idx ? 'done' : i === idx ? 'on' + (x.last ? ' last' : '') : ''}" style="--dur:${(x.dur || 0)/1000}s"><b></b></i>`).join('');
  const b = barsEl.querySelector('.on b');
  if (b && !s.last) b.addEventListener('animationend', next, { once: true });
  applyPause();
}
function applyPause(){
  const paused = userPaused || holding || document.hidden;
  const b = barsEl.querySelector('.on b');
  if (b) b.style.animationPlayState = paused ? 'paused' : 'running';
  pp.setAttribute('aria-label', userPaused ? 'Play' : 'Pause');
  pp.innerHTML = userPaused
    ? '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
}

function renderDock(){
  const s = slides[idx];
  dock.classList.toggle('off', !!s.last);
  const f = s.flavour || null;
  dock.innerHTML = `<a class="round" href="${telLink()}" aria-label="Call ${esc(SITE.phone)}">${svg('phone')}</a>
    <a class="wa" href="${waLink(f)}" rel="noopener">${svg('chat')}${f ? 'Order ' + esc(f.name) : 'Order on WhatsApp'}</a>
    <a class="round" href="${mailLink(f)}" aria-label="Email ${esc(SITE.email)}">${svg('mail')}</a>`;
}

function show(i){
  idx = Math.max(0, Math.min(slides.length - 1, i));
  const s = slides[idx];
  paintBg(s.theme, s.cover, s.photoAlt);
  slideEl.className = 'slide' + (s.cover ? ' photo' : '');
  slideEl.innerHTML = s.html();
  slideEl.setAttribute('aria-label', s.key);
  renderBars();
  renderDock();
  const again = $('#again'); if (again) again.addEventListener('click', () => show(0));
}
function next(){ if (idx < slides.length - 1) show(idx + 1); }
function prev(){ if (idx > 0) show(idx - 1); }

/* tap = next (right side) or back (left side). hold = pause. swipe = move. */
const zone = $('#zone');
let down = null, holdTimer = null;
zone.addEventListener('pointerdown', e => {
  down = { x: e.clientX, t: Date.now() };
  holdTimer = setTimeout(() => { holding = true; applyPause(); }, 260);
});
const release = (e, cancelled) => {
  clearTimeout(holdTimer);
  if (!down) return;
  const wasHolding = holding;
  holding = false; applyPause();
  const dx = e.clientX - down.x; down = null;
  if (cancelled || wasHolding) return;
  if (Math.abs(dx) > 45) { dx < 0 ? next() : prev(); return; }
  const r = zone.getBoundingClientRect();
  (e.clientX - r.left) < r.width * 0.32 ? prev() : next();
};
zone.addEventListener('pointerup', e => release(e, false));
zone.addEventListener('pointercancel', e => release(e, true));
zone.addEventListener('contextmenu', e => e.preventDefault());
$('#prevBtn').addEventListener('click', prev);
$('#nextBtn').addEventListener('click', next);
pp.addEventListener('click', () => { userPaused = !userPaused; applyPause(); });
document.addEventListener('visibilitychange', applyPause);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ' && e.target === document.body){ e.preventDefault(); userPaused = !userPaused; applyPause(); }
});

show(0);
</script>
</body>
